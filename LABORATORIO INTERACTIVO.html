q('Identifica la tesis central del fragmento.', ['Hay árboles en el barrio.','La temperatura varía durante el día.','Los parques deberían tener más árboles.','Algunos vecinos juegan en el parque.'],2,'La autora defiende aumentar los árboles en los parques; la sombra y la convivencia son razones que apoyan esa propuesta.','«En nuestro barrio, los parques deberían tener más árboles. Su sombra invita a permanecer en ellos y ofrece lugares de encuentro para los vecinos». '),
q('¿Qué pregunta ayuda mejor a localizar una tesis?', ['¿Cuántas comas tiene el texto?','¿En qué ciudad vive el autor?','¿Qué palabra aparece más veces?','¿Qué posición intenta defender el autor?'],3,'Una tesis expresa una posición que el autor sostiene; buscarla es identificar la afirmación principal que organiza los argumentos.'),
q('Lee la oración: «La contaminación del río preocupa a la comunidad». ¿Qué le falta para ser una tesis argumentativa clara?', ['Una posición específica que pueda defenderse.','Un adjetivo llamativo sobre el río.','Una fecha exacta de la contaminación.','Una pregunta dirigida al lector.'],0,'La frase plantea una preocupación, pero no deja clara una postura concreta. Por ejemplo: «El municipio debe priorizar la recuperación del río». '),
q('¿Qué opción presenta una tesis más precisa?', ['La educación es muy importante.','Hay diferentes formas de aprender.','Las escuelas deberían enseñar finanzas básicas desde secundaria.','Los estudiantes asisten a clase cada mañana.'],2,'Esta postura identifica una acción, un lugar y un nivel educativo; por eso es más defendible que una valoración vaga.'),
q('En este texto, ¿qué oración cumple la función de tesis?', ['«Practicar deporte fortalece la convivencia escolar».','«Muchas escuelas tienen equipos deportivos».','«Los partidos suelen jugarse en la tarde».','«El voleibol se practica con una pelota».'],0,'El texto defiende que el deporte favorece la convivencia y luego justifica esa idea. Las demás oraciones son datos descriptivos.','«Practicar deporte fortalece la convivencia escolar, porque exige cooperación, respeto por las reglas y resolución de desacuerdos».')
]},
{id:'argumentos',icon:'🧱',title:'Argumentos y pruebas',sub:'Razones que sostienen ideas',color:'#ffebe3',intro:'No basta con opinar: una tesis necesita razones pertinentes y evidencias.',theory:'Un argumento responde «¿por qué debería aceptar esta tesis?». Una evidencia —un dato verificable, un ejemplo pertinente o una fuente fiable— puede respaldar ese argumento.',contrast:'Tesis: debemos reducir el desperdicio de comida. Argumento: se malgastan recursos al producir alimentos que no se consumen. Evidencia: un registro de residuos medidos durante un mes.',tip:'No confundas repetir la tesis con demostrarla. Busca el «porque» y después pregunta: «¿Cómo lo sabemos?».',questions:[
q('¿Cuál oración es un argumento que apoya la tesis «El colegio debe contar con una huerta»?', ['La huerta se pintará de verde.','Una huerta permitiría aprender ciencias observando plantas reales.','La huerta estaría en el patio.','A algunas personas les gustan las flores.'],1,'La opción B explica por qué una huerta escolar sería valiosa: vincula la actividad con un beneficio educativo.'),
q('En el fragmento, ¿cuál parte es una evidencia y no la tesis?', ['«La encuesta anónima registró 84 respuestas».','«Se debería revisar el horario de descanso».','«El bienestar estudiantil merece atención».','«Es necesario escuchar a los cursos».'],0,'El registro de respuestas es un dato sobre la recolección de información: puede usarse como evidencia si su método y resultados se explican. No demuestra por sí solo una postura.','«Deberíamos revisar el horario de descanso. Una encuesta anónima registró 84 respuestas y mostró que muchos estudiantes consideran insuficiente la pausa».'),
q('¿Qué afirmación es una opinión, pero todavía no presenta un argumento?', ['Leer amplía el vocabulario porque expone a palabras nuevas.','Caminar ayuda a conocer el barrio y reconocer sus espacios.','Los clubes de lectura son maravillosos.','Debemos reciclar porque reduce residuos mezclados.'],2,'«Son maravillosos» expresa una valoración, pero no explica por qué. Una razón sería mostrar cómo un club fomenta el diálogo.'),
q('¿Cuál evidencia apoyaría de forma más directa la tesis «La campaña redujo el desperdicio de agua»?', ['El diseño azul de los afiches de la campaña.','La opinión del estudiante más popular.','Una frase motivadora de la campaña.','Mediciones comparables del consumo antes y después.'],3,'Los registros comparables permiten comprobar si el consumo cambió. Para atribuirle la causa a la campaña también hay que examinar otros factores.'),
q('¿Qué relación une estos dos enunciados?', ['El segundo contradice al primero.','El segundo justifica al primero.','Los dos dicen exactamente lo mismo.','El segundo es una conclusión contraria.'],1,'El segundo explica la utilidad concreta de la propuesta: practicar sin el miedo inicial a equivocarse.','«La escuela debería ofrecer clubes de conversación en inglés. En espacios pequeños, los estudiantes pueden practicar sin temor a equivocarse». '),
q('Elige la mejor razón para esta tesis: «Es útil enseñar a verificar noticias digitales».', ['Porque a mí me parece bonito.','Porque todas las noticias son falsas.','Porque permite distinguir fuentes confiables y engañosas.','Porque internet siempre tiene razón.'],2,'La opción C ofrece un beneficio directamente relacionado con la alfabetización informacional. Las otras razones son vagas o exageradas.')
]},
{id:'contra',icon:'⚖️',title:'Objeciones y refutación',sub:'Escuchar, responder, fortalecer',color:'#e0f6e9',intro:'Aprende a reconocer una postura contraria y a responderla sin atacar personas.',theory:'Un contraargumento presenta una objeción razonable a la tesis. La refutación responde a esa objeción mediante razones o precisiones, sin fingir que no existe.',contrast:'Tesis: ampliar el recreo. Contraargumento: quitaría tiempo de clase. Refutación: se puede reorganizar la jornada sin reducir los minutos de aprendizaje.',tip:'Los marcadores «aunque», «algunas personas sostienen» y «sin embargo» pueden dar pistas, pero mira siempre la función real del enunciado.',questions:[
q('¿Cuál enunciado es un contraargumento a «El uniforme debería ser opcional»?', ['La ropa expresa estilos personales.','Elegir prendas puede ser divertido.','El uniforme representa igualdad para algunas familias.','La ropa puede comprarse en varios colores.'],2,'La opción C ofrece una razón contra la propuesta de volver opcional el uniforme. No basta con mencionar el tema: debe objetar la postura.'),
q('¿Cuál oración funciona como refutación en el fragmento?', ['«El cambio requeriría inversión».','«Se propone instalar bebederos».','«Algunas personas temen altos gastos».','«Sin embargo, el ahorro en envases puede compensar parte del costo».'],3,'La frase introducida por «sin embargo» responde a la objeción económica con una consideración adicional; no elimina el costo, pero lo matiza.','«Se propone instalar bebederos. Algunas personas temen altos gastos. Sin embargo, el ahorro en envases puede compensar parte del costo». '),
q('¿Cuál es la respuesta más sólida a «Los talleres de arte quitan tiempo a las materias principales»?', ['Quienes opinan eso no entienden nada.','Los talleres pueden integrarse a lenguaje e historia con proyectos.','El arte es mejor que todas las materias.','Nadie se cansa cuando dibuja.'],1,'La respuesta B enfrenta la objeción del tiempo proponiendo una forma de integrar contenidos, en lugar de insultar o exagerar.'),
q('La frase «Algunos vecinos creen que cerrar la calle los domingos dificulta el transporte» representa…', ['Una posible objeción a la medida.','Una prueba estadística de su éxito.','La conclusión principal del autor.','Una definición de espacio público.'],0,'Se presenta la preocupación de quienes no apoyan la propuesta: eso es un contraargumento posible, todavía no una refutación.'),
q('¿Qué estructura argumentativa es más completa?', ['Tesis → repetir tesis → finalizar.','Opinión → insulto → conclusión.','Tesis → razones → objeción → respuesta.','Pregunta → ejemplo → cambio de tema.'],2,'Una secuencia completa defiende la postura, considera una objeción relevante y responde a ella con razones.'),
q('¿Por qué conviene incluir una objeción razonable?', ['Para mostrar que todas las ideas son falsas.','Para reemplazar la tesis con otra cosa.','Para evitar tener que buscar evidencias.','Para demostrar que se consideran otras perspectivas.'],3,'Reconocer una objeción ayuda a construir un argumento más honesto y mejor fundamentado; además anticipa preguntas del lector.')
]},
{id:'evidencia',icon:'🔬',title:'¿Prueba convincente?',sub:'Calidad, pertinencia y fuentes',color:'#e0f2ff',intro:'Aprende a distinguir la evidencia sólida de un caso aislado o una cifra sin contexto.',theory:'Una evidencia útil debe ser pertinente para la tesis, fiable y suficientemente explicada. Un número no es automáticamente una prueba: importa quién lo obtuvo, cómo y cuándo.',contrast:'Débil: «Mi primo estudió escuchando música y aprobó». Más fuerte: «Un estudio con método transparente comparó distintos ambientes de estudio y midió resultados».',tip:'Haz cuatro preguntas: ¿de dónde sale?, ¿cómo se obtuvo?, ¿se relaciona con la tesis?, ¿hay otra explicación?',questions:[
q('Una publicación afirma «El 90 % prefiere leer en pantalla». ¿Qué conviene averiguar primero?', ['Si el titular usa una letra elegante.','Cuántas personas respondieron y cómo fueron elegidas.','Si el texto tiene más de dos párrafos.','Qué color aparece junto al porcentaje.'],1,'Sin tamaño y forma de selección de la muestra, ese 90 % puede no representar al grupo sobre el que se está hablando.'),
q('¿Cuál fuente es más apropiada para analizar la asistencia a la biblioteca escolar?', ['Un comentario sin fecha en una red social.','Una fotografía de la entrada.','El registro institucional de préstamos y visitas.','La impresión de una sola persona.'],2,'Los registros de visitas y préstamos son evidencia directa, aunque también conviene revisar sus criterios de registro.'),
q('Una estudiante dice: «A mí me funcionó; por lo tanto, funcionará para todos». ¿Qué falla?', ['Convierte una experiencia aislada en regla general.','Emplea una comparación bien controlada.','Aporta una muestra amplia y representativa.','Distingue cuidadosamente los contextos.'],0,'Una experiencia personal puede ilustrar, pero no basta para generalizar el resultado a todas las personas.'),
q('¿Qué dato sería MENOS pertinente para evaluar si un huerto escolar mejoró los hábitos de alimentación?', ['La frecuencia de consumo de verduras.','Las encuestas de hábitos antes y después.','Los registros de participación en el huerto.','La cantidad de ventanas del salón.'],3,'El número de ventanas no responde a la pregunta sobre alimentación. La pertinencia exige una relación directa con la tesis.'),
q('¿Qué problema tiene la frase «Un experto dijo que esto es verdad», sin más información?', ['Incluye una cita demasiado detallada.','No permite comprobar quién es el experto ni sus razones.','Presenta una medición transparente.','Compara datos de dos periodos.'],1,'Apelar a un supuesto experto sin identificarlo ni explicar su fundamento impide evaluar la credibilidad de la fuente.'),
q('Tras instalar carteles de ahorro, bajó el consumo de energía. ¿Qué conclusión es más cuidadosa?', ['Los carteles demostraron ser la única causa.','Toda reducción futura estará garantizada.','Hubo una reducción, pero deben revisarse otros factores.','Los carteles nunca producen ningún cambio.'],2,'Un cambio posterior no confirma por sí solo causalidad. También podrían influir el clima, los horarios o el número de personas.')
]},
{id:'falacias',icon:'🕵️',title:'Detectives de falacias',sub:'Errores que parecen convencer',color:'#fff0d5',intro:'Identifica errores frecuentes sin olvidar que el contexto importa.',theory:'Una falacia es un error en el razonamiento. Algunas atacan personas, otras generalizan desde pocos casos, proponen falsos dilemas o atribuyen causas sin justificación.',contrast:'«No escuches a Marta sobre reciclaje; llegó tarde una vez». Se ataca a la persona en vez de examinar sus argumentos sobre reciclaje.',tip:'Pregúntate si la conclusión se sigue realmente de las razones. Algo puede sonar convincente y aun así no estar demostrado.',questions:[
q('«No aceptes lo que dice Lina sobre transporte: sus zapatos son feos». ¿Qué ocurre?', ['Se comparan dos propuestas.','Se ofrece una prueba pertinente.','Se reconoce una objeción justa.','Se ataca a la persona y no a su idea.'],3,'Es un ataque personal (ad hominem): la apariencia de Lina no demuestra que su propuesta sea incorrecta.'),
q('«Dos estudiantes llegaron tarde en bicicleta; quienes usan bicicleta siempre llegan tarde». Identifica el problema.', ['Una conclusión basada en una muestra insuficiente.','Una comparación con datos representativos.','Una refutación sustentada en cifras.','Una tesis formulada con precisión.'],0,'Generalización apresurada: dos casos no permiten hablar de todas las personas que usan bicicleta.'),
q('«O prohibimos toda tecnología en clase o dejamos de educar». ¿Qué error presenta?', ['Una definición demasiado amplia.','Una objeción respaldada con fuentes.','Un falso dilema entre dos extremos.','Una conclusión basada en una encuesta.'],2,'Se ignoran alternativas intermedias, como reglas de uso, momentos sin pantallas o actividades guiadas.'),
q('«Desde que pintaron el salón mejoraron las notas: la pintura causó el resultado». ¿Por qué es dudoso?', ['Cita demasiadas fuentes.','Confunde sucesión temporal con causalidad.','Incluye demasiadas objeciones.','Describe una muestra muy amplia.'],1,'Que algo ocurra después de otra cosa no demuestra que la primera lo causó. Hay que considerar otros factores.'),
q('«Todo el mundo comparte ese video; por eso es verdadero». ¿Cuál es la falla?', ['Comparar evidencias contradictorias.','Consultar los métodos de publicación.','Reconocer los límites de la muestra.','Usar la popularidad como prueba de verdad.'],3,'La cantidad de personas que comparte un contenido no confirma si su información es verdadera.'),
q('¿Cuál respuesta evita mejor caer en una falacia al debatir?', ['«Revisemos la fuente y comparemos sus razones».','«No sabes nada; por eso estás equivocado».','«Todos opinan así, entonces es verdad».','«O estás conmigo o estás contra mí».'],0,'La primera invita a examinar evidencia y razonamientos. Las otras apelan a ataques, popularidad o falsas alternativas.')
]},
{id:'estructura',icon:'🧵',title:'Conecta tus ideas',sub:'Organiza un texto argumentativo',color:'#ffe5ed',intro:'Reconoce cómo una introducción, un desarrollo y un cierre trabajan juntos.',theory:'Un texto argumentativo suele presentar el tema y la tesis, desarrollar razones con evidencias, considerar otras posturas y cerrar retomando la posición. No todos siguen una fórmula rígida.',contrast:'«En primer lugar» puede iniciar una razón; «por ejemplo» introduce una ilustración; «sin embargo» marca contraste; «por tanto» señala una conclusión.',tip:'No identifiques la función únicamente por un conector: comprueba qué está haciendo realmente la oración.',questions:[
q('¿Cuál conector expresa oposición entre ideas?', ['Por ejemplo.','Sin embargo.','Además.','Es decir.'],1,'«Sin embargo» introduce un contraste. «Por ejemplo» ilustra; «además» suma información; «es decir» reformula.'),
q('¿Qué oración presenta mejor una conclusión?', ['Por ejemplo, un colegio de otra ciudad lo intentó.','En primer lugar, el proyecto es sencillo.','Aunque algunos estudiantes prefieren otra opción…','Por estas razones, conviene ampliar los espacios de lectura.'],3,'La expresión «por estas razones» recoge la argumentación y reafirma la propuesta como cierre.'),
q('Ordena mentalmente las partes de un texto claro. ¿Cuál secuencia tiene más sentido?', ['Tesis → argumentos → objeción y respuesta → conclusión.','Conclusión → ataque → tesis → tema.','Ejemplo → conclusión → título → razón.','Objeción → despedida → ejemplo → tesis.'],0,'Se presenta la postura, se justifica, se reconoce una objeción y luego se cierra el razonamiento.'),
q('¿Cuál conector introduce mejor una ilustración concreta?', ['En cambio.','No obstante.','Por ejemplo.','A pesar de.'],2,'«Por ejemplo» anuncia un caso que permite visualizar o respaldar una idea general.'),
q('¿Qué problema tiene cerrar un texto agregando una tesis completamente nueva?', ['Ayuda a mantener la coherencia.','Debilita la unidad del texto y desconcierta al lector.','Aclara los argumentos anteriores.','Siempre ofrece evidencia suficiente.'],1,'Una conclusión debe relacionarse con lo argumentado. Introducir una tesis distinta al final deja sin desarrollo la nueva propuesta.'),
q('¿Cuál frase integra mejor una objeción con su respuesta?', ['«La propuesta es excelente, excelente, excelente».','«No hay dudas ni preguntas sobre el tema».','«Finalmente, eso fue todo lo que pasó».','«Aunque requiere recursos, puede aplicarse por etapas».'],3,'La construcción «aunque…, puede…» admite una dificultad y propone cómo responderla, sin ocultarla.')
]}
];
const articles=[
{title:'¿Debe haber momentos sin celular en el colegio?',tag:'Vida escolar · 4 minutos',desc:'Una propuesta con razones, objeción y respuesta.',paragraphs:[
'En muchos colegios, el celular se ha convertido en una herramienta cotidiana. Sirve para consultar información, coordinar actividades y comunicarse con la familia. Sin embargo, su presencia constante también plantea una pregunta: ¿cómo aprovechar sus posibilidades sin permitir que interrumpa cada conversación y cada clase?',
'Sostengo que los colegios deberían establecer momentos definidos sin uso de celular, en lugar de prohibirlo durante toda la jornada. Una norma equilibrada podría reservar las pantallas para las actividades en las que aportan un beneficio claro y dar espacio a la atención compartida en otros momentos.',
'La primera razón es que aprender exige períodos de concentración. Si una clase se interrumpe repetidamente para responder notificaciones, recuperar el hilo de una explicación puede resultar difícil. Además, los descansos pueden convertirse en oportunidades para conversar cara a cara, jugar o resolver desacuerdos entre compañeros. Esto no significa que todas las interacciones digitales sean negativas, sino que conviene diversificar las maneras de relacionarnos.',
'Algunas familias podrían objetar que sus hijos necesitan el celular disponible para cualquier emergencia. Esa preocupación merece atención. Por eso, la propuesta no exige retirar los dispositivos de forma absoluta: contempla canales de comunicación con las familias y excepciones justificadas. También sería importante que los docentes informaran con anticipación cuándo se utilizará el teléfono como herramienta pedagógica.',
'En conclusión, establecer momentos sin celular puede ayudar a equilibrar concentración, convivencia y uso responsable de la tecnología. La discusión no debería ser «tecnología sí o no», sino en qué situaciones mejora verdaderamente la experiencia escolar.'
],questions:[
q('¿Cuál es la tesis del texto?', ['Las familias usan teléfonos para comunicarse.','Los celulares deberían desaparecer del colegio.','Conviene definir momentos sin celular, sin prohibirlo siempre.','Toda comunicación digital afecta la convivencia.'],2,'El autor propone una regulación equilibrada. No defiende una prohibición total ni sostiene que toda tecnología sea perjudicial.'),
q('¿Qué razón se ofrece para apoyar la tesis?', ['Las interrupciones pueden dificultar mantener la concentración.','Las pantallas son siempre perjudiciales para cualquier tarea.','Las escuelas no deben consultar a las familias.','Los descansos tienen que durar menos tiempo.'],0,'El argumento de la concentración aparece de manera explícita en el tercer párrafo.'),
q('¿Cuál es el contraargumento reconocido?', ['El celular permite realizar algunas actividades.','Hay estudiantes que prefieren hablar cara a cara.','La tecnología puede servir para buscar datos.','Las familias necesitan comunicación ante emergencias.'],3,'El texto reconoce el riesgo de limitar la disponibilidad del celular en situaciones urgentes.'),
q('¿Cómo responde el autor a la preocupación familiar?', ['Propone prohibir todos los dispositivos.','Sugiere canales de comunicación y excepciones.','Niega la posibilidad de emergencias.','Elimina cualquier norma de uso.'],1,'La respuesta aborda la dificultad planteando comunicación institucional y excepciones justificadas.'),
q('¿Qué tono caracteriza mejor al texto?', ['Acusatorio, porque culpa a cada estudiante.','Indiferente, porque no plantea soluciones.','Matizado, porque considera beneficios y riesgos.','Absolutista, porque rechaza toda pantalla.'],2,'La argumentación distingue usos útiles de interrupciones y acepta una objeción plausible.'),
q('¿Qué evidencia adicional ayudaría a evaluar la propuesta?', ['Comparaciones de atención y convivencia antes y después.','Una lista de marcas de celulares populares.','La opinión de un solo estudiante sin contexto.','Un anuncio publicitario de dispositivos.'],0,'Datos comparables y bien recogidos servirían para evaluar si la norma produce los beneficios propuestos.')
]},
{title:'Una biblioteca que salga de sus paredes',tag:'Comunidad · 4 minutos',desc:'Lee una propuesta comunitaria y examina sus fundamentos.',paragraphs:[
'Una biblioteca no es solamente un edificio donde se guardan libros. También puede ser un espacio para compartir historias, investigar y encontrarse con otras personas. Pero cuando queda lejos del barrio, sus servicios pueden resultar difíciles de aprovechar, especialmente para quienes disponen de poco tiempo o tienen dificultades de transporte.',
'Por eso, considero que las bibliotecas públicas deberían organizar pequeñas jornadas de lectura en parques y espacios comunitarios. No se trata de reemplazar las sedes tradicionales, sino de acercar una parte de sus actividades a lugares donde ya se reúnen las familias.',
'Un encuentro al aire libre podría incluir lectura compartida, préstamo temporal de libros y talleres breves en los que niñas, niños y personas adultas recomienden historias. La propuesta tiene una ventaja: permite que quienes nunca han entrado a una biblioteca conozcan sus servicios en un ambiente cercano. También ofrece la posibilidad de escuchar qué tipos de libros y actividades interesan a la comunidad.',
'Es cierto que llevar libros fuera de una sede plantea dificultades: hay que protegerlos de la lluvia, organizar préstamos y contar con personal. Estas condiciones no deberían ignorarse. Sin embargo, un proyecto piloto de una tarde al mes, con carpas, una selección pequeña de materiales y registro de participación, permitiría observar qué funciona antes de ampliarlo.',
'Para decidir si esta idea merece continuar, no bastaría con contar asistentes a una sola jornada. Sería útil preguntar a quienes participan qué aprendieron, revisar cuántas personas regresan y registrar el uso de los préstamos. La biblioteca del futuro puede mantenerse en su edificio y, al mismo tiempo, encontrar nuevas maneras de llegar a sus lectores.'
],questions:[
q('La tesis principal propone…', ['Cerrar las bibliotecas que están lejos.','Organizar lecturas comunitarias fuera de la sede.','Reemplazar los libros con eventos deportivos.','Reducir el préstamo de textos a las familias.'],1,'La tesis está expresada en el segundo párrafo: jornadas en parques y espacios comunitarios, sin sustituir los edificios.'),
q('¿Cuál idea sirve de argumento para esa tesis?', ['Toda biblioteca necesita un edificio más grande.','Los parques tienen siempre buenas condiciones.','Los talleres deberían tener exactamente una hora.','Los encuentros acercan servicios a quienes no los usan.'],3,'El autor explica que las jornadas pueden llegar a personas que no conocen o no pueden aprovechar fácilmente la biblioteca.'),
q('¿Cuál es la objeción que el texto reconoce?', ['Transportar y cuidar los libros exige organización.','Leer al aire libre sería imposible en cualquier lugar.','Las familias no quieren participar en actividades.','Los préstamos bibliotecarios dejaron de ser útiles.'],0,'El cuarto párrafo reconoce dificultades logísticas reales: protección, préstamos y personal.'),
q('La sugerencia del «proyecto piloto» cumple la función de…', ['Cambiar de tema para evitar la objeción.','Repetir exactamente la preocupación anterior.','Responder a los riesgos con una prueba controlada.','Desestimar la organización de los préstamos.'],2,'La prueba pequeña y evaluable es una refutación práctica: admite dificultades y propone aprender antes de ampliar.'),
q('¿Por qué contar los asistentes de un solo día sería insuficiente?', ['Porque nadie puede contar a los visitantes.','Porque no indica por sí solo el impacto sostenido.','Porque el préstamo de libros está prohibido.','Porque las encuestas siempre son incorrectas.'],1,'La asistencia de una fecha muestra participación puntual, pero no hábitos, satisfacción o continuidad.'),
q('¿Qué función cumple el último párrafo?', ['Presentar una objeción que no se responde.','Cambiar la propuesta por una completamente distinta.','Definir formalmente qué es una biblioteca.','Proponer una evaluación y reafirmar la idea.'],3,'El cierre sugiere indicadores para valorar el piloto y reafirma la importancia de acercar la biblioteca a la comunidad.')
]},
{title:'¿Quién cuida el patio después del recreo?',tag:'Ambiente · 5 minutos',desc:'Analiza la diferencia entre soluciones rápidas y cambios sostenibles.',paragraphs:[
'Después del recreo, el patio de una institución educativa puede quedar lleno de vasos, envolturas y servilletas. A veces se responde colocando más canecas; otras veces se organiza una jornada de limpieza. Ambas medidas pueden ser útiles, pero surge una pregunta más profunda: ¿cómo hacer que la reducción de residuos se convierta en un hábito y no en una actividad ocasional?',
'Defiendo que las escuelas deberían combinar puntos claros de separación de residuos con actividades periódicas dirigidas por estudiantes. Comprar recipientes nuevos, sin enseñar para qué sirven y sin revisar su uso, no es suficiente para lograr un cambio duradero.',
'La primera razón es que un hábito se aprende mejor cuando se practica y se comprende. Si un grupo identifica qué residuos produce, discute cómo reducirlos y participa en el cuidado del patio, puede comprender el efecto de sus decisiones. La segunda razón es que la participación estudiantil aporta ideas que no siempre aparecen en una instrucción escrita: por ejemplo, ajustar la ubicación de las canecas según los lugares donde se generan más desechos.',
'Quienes prefieren contratar más personal de limpieza señalan algo importante: las instalaciones deben mantenerse limpias, y el trabajo de aseo requiere tiempo y esfuerzo. Esta objeción no invalida la propuesta educativa. El personal es necesario para realizar su labor, mientras que las actividades de aprendizaje buscan disminuir la cantidad de residuos que se dejan en el suelo. Son funciones distintas y pueden complementarse.',
'Para saber si el programa funciona, la comunidad podría registrar durante varias semanas qué tipo de residuos encuentra en zonas específicas y comparar los resultados, considerando además cambios en la asistencia o en las actividades escolares. Una disminución observada sería una señal alentadora, aunque no bastaría, por sí sola, para probar la causa del cambio.',
'Así, mantener el patio limpio no depende exclusivamente de contratar personal ni de instalar canecas. También requiere hábitos, información y responsabilidades compartidas. La escuela puede convertir un problema cotidiano en una oportunidad de aprendizaje colectivo.'
],questions:[
q('¿Cuál formulación expresa mejor la tesis?', ['La limpieza escolar compete solo al personal de aseo.','Basta con comprar canecas nuevas para lograr el cambio.','Debe combinarse la separación de residuos con participación estudiantil.','Es imposible evaluar los residuos del patio.'],2,'La postura principal combina infraestructura para separar residuos y actividades formativas lideradas por estudiantes.'),
q('La frase «un hábito se aprende mejor cuando se practica y se comprende» es…', ['Un argumento que justifica la propuesta.','Una cifra que mide el impacto logrado.','Una objeción contra la participación.','Una conclusión sin relación con el tema.'],0,'La frase ofrece una razón educativa a favor de integrar a los estudiantes en el cuidado del patio.'),
q('¿Qué objeción considera el texto?', ['Los estudiantes no generan residuos.','Registrar datos no requiere esfuerzo.','Las canecas no pueden cambiar de lugar.','También se necesita personal dedicado a la limpieza.'],3,'El cuarto párrafo reconoce la importancia del trabajo de limpieza; después explica que ese trabajo y la educación son complementarios.'),
q('¿Qué respuesta ofrece el autor ante esa objeción?', ['Rechaza por completo la labor del personal.','Distingue la limpieza del aprendizaje de hábitos.','Sostiene que los estudiantes deben hacer todo.','Asegura que más personal nunca es necesario.'],1,'La refutación sostiene que el personal realiza una tarea necesaria mientras la educación busca prevenir residuos.'),
q('¿Cuál sería una evidencia pertinente de progreso?', ['El color de las canecas compradas.','Los gustos musicales de quienes limpian.','Registros comparables de residuos durante varias semanas.','El número de letras de los carteles.'],2,'Contar y clasificar residuos a lo largo del tiempo puede mostrar tendencias, si se consideran cambios en las condiciones escolares.'),
q('El autor afirma que una reducción observada no demuestra por sí sola la causa. Esto muestra…', ['Precaución al interpretar una relación causal.','Rechazo absoluto a medir los resultados.','Falta de interés por las actividades escolares.','Que los registros necesariamente son falsos.'],0,'El autor reconoce que puede haber factores alternativos, una actitud crítica ante la evidencia.')
]}
];

const TOTAL=lessons.reduce((s,l)=>s+l.questions.length,0)+articles.reduce((s,l)=>s+l.questions.length,0);
const storageKey='ARGUMENTALAB_V1';
function load(){try{return JSON.parse(localStorage.getItem(storageKey))||{}}catch(e){return {}}}
let state=Object.assign({page:'home',answers:{},article:0,notes:{},map:0,fontsize:0},load());
if(!sections.some(s=>s.id===state.page))state.page='home';
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}};
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answered=()=>Object.values(state.answers).filter(a=>a&&Number.isInteger(a.choice)).length;
const correct=()=>Object.values(state.answers).filter(a=>a&&a.correct).length;
const points=()=>correct()*10;
const percent=()=>Math.round(100*answered()/TOTAL);
const moduleKey=(id,i)=>`${id}_${i}`;
const lessonComplete=(id)=>{const item=lessons.find(l=>l.id===id);return item&&item.questions.every((_,i)=>state.answers[moduleKey(id,i)]);};
const articleComplete=(index)=>articles[index].questions.every((_,i)=>state.answers[moduleKey('lectura'+index,i)]);
function countBy(id){let qs=lessons.find(l=>l.id===id)?.questions||[];if(id==='lecturas')qs=articles.flatMap(a=>a.questions);if(id==='lecturas')return articles.reduce((n,a,j)=>n+a.questions.filter((_,i)=>state.answers[moduleKey('lectura'+j,i)]).length,0);return qs.filter((_,i)=>state.answers[moduleKey(id,i)]).length}
function updateBars(){document.getElementById('side-percent').textContent=percent()+'%';document.getElementById('side-fill').style.width=percent()+'%';document.getElementById('side-questions').textContent=`${answered()} de ${TOTAL} ejercicios resueltos`;document.getElementById('top-stars').textContent=`⭐ ${points()} puntos`;document.getElementById('top-done').textContent=`✅ ${answered()} / ${TOTAL}`;}
function renderNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button type="button" data-action="navigate" data-page="${s.id}" class="${state.page===s.id?'active':''}" ${state.page===s.id?'aria-current="page"':''}><span class="icon" aria-hidden="true">${s.icon}</span><span>${s.title}</span>${((lessonComplete(s.id))||(s.id==='lecturas'&&articles.every((a,i)=>articleComplete(i))))?'<span class="done" aria-label="Completado">✓</span>':''}</button>`).join('')}

function toast(message){const old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function sparkle(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){let part=document.createElement('span');part.className='confetti';part.style.left=(Math.random()*100)+'vw';part.style.background=['#ffb9ac','#8a66ef','#a4e6c3','#ffd77b'][i%4];part.style.animationDelay=(Math.random()*.5)+'s';part.style.transform=`rotate(${Math.random()*180}deg)`;document.body.append(part);setTimeout(()=>part.remove(),2500)}}
function headerTag(text){return `<span class="eyebrow">${text}</span>`}
function renderHome(){return `<section class="hero"><div class="hero-text">${headerTag('Bienvenid@ al club de las buenas ideas')}<h1>Una opinión<br>no es un <span class="serif" style="color:#ffcfa5">argumento.</span></h1><p>¡Aprende a defender ideas sin gritar! Detecta tesis, descubre razones, responde objeciones y conviértete en detective de textos.</p><button type="button" class="btn yellow" data-action="navigate" data-page="tesis">Comenzar la aventura <span aria-hidden="true">↗</span></button></div><div class="hero-figure" aria-hidden="true"><span>🧠</span></div><span class="hero-star one" aria-hidden="true">✳</span><span class="hero-star two" aria-hidden="true">✦</span></section>

function tile(id,icon,title,desc,footer,color){return `<button type="button" class="module-tile" data-action="navigate" data-page="${id}"><span class="bubble" style="background:${color}" aria-hidden="true">${icon}</span><strong>${title}</strong><p>${safe(desc)}</p><span class="tile-footer"><span>${footer}</span><span aria-hidden="true">Explorar →</span></span></button>`}
const mapDetails=[['TESIS','Es una postura debatible. En nuestro ejemplo, propone dedicar un tiempo específico a la lectura.'],['ARGUMENTO','Da una razón: explica por qué sería beneficioso reservar tiempo para leer.'],['EVIDENCIA','Indica qué información se podría reunir para comprobar si el beneficio se observa realmente. No es un resultado inventado.'],['CONTRAARGUMENTO','Plantea una dificultad genuina: el tiempo disponible para otras actividades escolares.'],['REFUTACIÓN','Responde al problema del tiempo con una alternativa concreta. Reconoce la objeción y propone una salida.']];

function questionHTML(quest,key,i){const record=state.answers[key];return `<article class="question ${record?(record.correct?'correct':'incorrect'):''}" id="question-${key}"><span class="q-num">Reto ${String(i+1).padStart(2,'0')} · Selecciona una respuesta</span>${quest.context?`<div class="q-context">${safe(quest.context)}</div>`:''}<h3>${safe(quest.prompt)}</h3><div class="options">${quest.options.map((opt,j)=>`<button type="button" class="option ${record&&record.choice===j?'chosen '+(record.correct?'correct-opt':'wrong-opt'):''} ${record&&!record.correct&&j===quest.answer?'revealed':''}" data-action="answer" data-q="${key}" data-choice="${j}" ${record?'disabled':''} aria-label="Opción ${'ABCD'[j]}: ${safe(opt)}"><span class="letter">${'ABCD'[j]}</span><span>${safe(opt)}</span></button>`).join('')}</div>${record?`<div class="feedback ${record.correct?'good':'bad'}" role="status"><b>${record.correct?'🌟 ¡Excelente! Identificaste la idea.':'💡 Buena oportunidad para aprender.'}</b><p>${!record.correct?`La respuesta correcta es <strong>${'ABCD'[quest.answer]}: ${safe(quest.options[quest.answer])}</strong>. `:''}${safe(quest.explain)}</p><div class="reply"><span>${record.correct?'Sumaste 10 puntos.':'Relee la explicación y vuelve a intentarlo.'}</span><button type="button" data-action="retry" data-q="${key}">↻ Reintentar</button></div></div>`:''}</article>`}

function renderLesson(l){const idx=lessons.indexOf(l);const done=countBy(l.id);return `<div class="lesson-head"><div>${headerTag(`Estación ${String(idx+1).padStart(2,'0')} · 6 actividades`)}<h1>${l.title}</h1><p>${safe(l.intro)}</p></div><div class="lesson-emoji" aria-hidden="true">${l.icon}</div></div><section class="theory"><div><span class="eyebrow">PRIMERO, ENTIENDE EL CONCEPTO</span><h2>La idea clave</h2><p>${safe(l.theory)}</p><p style="font-size:13px"><strong>Ejemplo:</strong> ${safe(l.contrast)}</p></div><div class="theory-side"><b>💡 PISTA DE LECTOR EXPERTO</b>${safe(l.tip)}</div></section><div class="quiz-top"><div class="section-row" style="margin-top:0"><div><h2>Activa tu radar <span aria-hidden="true">🎮</span></h2><p>Responde, revisa por qué y corrige si es necesario.</p></div><div class="progress-inline"><div class="track"><div class="fill" style="width:${done/6*100}%"></div></div>${done}/6</div></div></div>${questionsHTML(l.questions,l.id)}<div class="nextbar"><button class="btn outline" type="button" data-action="navigate" data-page="${sections[sections.findIndex(s=>s.id===l.id)-1]?.id||'home'}">← Anterior</button><button class="btn" type="button" data-action="navigate" data-page="${sections[sections.findIndex(s=>s.id===l.id)+1]?.id||'lecturas'}">Siguiente estación →</button></div>`}

function previewWriting(){let n=writingChecklist();let out=document.getElementById('writing-preview');const parts=Object.entries(prompts).filter(([k])=>(state.notes[k]||'').trim());if(!parts.length){toast('Escribe alguna idea para crear tu texto.');return}const paragraphs=[['tesis','razon','evidencia'],['objecion','refutacion'],['cierre']].map(group=>group.filter(k=>(state.notes[k]||'').trim()).map(k=>safe(state.notes[k])).join(' ')).filter(Boolean);out.innerHTML=`<section class="white-card" style="margin-top:19px;animation:popin .3s ease"><span class="eyebrow">VISTA PREVIA DE TU TEXTO</span><h2>${safe(state.notes.tema||'Mi texto argumentativo')}</h2><div class="article-text">${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div><div class="note">✅ Has completado ${n} de 7 pasos de estructura. Esta revisión es automática y no verifica si tus argumentos son verdaderos o sólidos. Relee tu escrito y consulta tus fuentes.</div></section>`;out.scrollIntoView({behavior:'smooth',block:'start'});toast(n===7?'¡Completaste todas las partes! Revisa ahora la calidad de tus razones.':'Ya puedes revisar cómo va quedando tu texto.')}
function downloadText(){const fields=Object.entries(prompts).map(([k,n])=>n.toUpperCase()+'\n'+(state.notes[k]||'[sin completar]')).join('\n\n');const txt=`ARGUMENTA LAB — MI TEXTO ARGUMENTATIVO\n\n${fields}\n\nREVISIÓN: Verifica que tus evidencias sean reales, pertinentes y verificables.\n`;const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});const href=URL.createObjectURL(blob);const link=document.createElement('a');link.href=href;link.download='Mi_texto_argumentativo.txt';link.click();setTimeout(()=>URL.revokeObjectURL(href),500);toast('Tu texto se descargó como archivo TXT.');}
function renderAchievements(){const a=answered(),c=correct(),w=writingChecklistWithoutUI();const awards=[['🎯','Cazatesis','Contesta 6 preguntas.',a>=6],['🌈','Ideas brillantes','Resuelve 18 preguntas.',a>=18],['🔬','Detective crítico','Resuelve 36 preguntas.',a>=36],['👑','Gran argumentador','Completa los 54 retos.',a===TOTAL],['✍️','Pluma valiente','Completa el taller de escritura.',w===7],['💎','Mirada aguda','Obtén 40 respuestas correctas.',c>=40]];return `<div class="lesson-head"><div>${headerTag('Tu camino · Estación de logros')}<h1>¡Tus ideas cuentan!</h1><p>Mira cuánto has practicado. Lo importante no es acertar todo a la primera, sino revisar y aprender.</p></div><div class="lesson-emoji" aria-hidden="true">🏆</div></div><div class="result-card"><span class="eyebrow" style="color:#f9dca7">TU TABLERO DE ESTUDIO</span><h2>${a===TOTAL?'¡Terminaste todos los retos! 🎉':'Cada pregunta te hace pensar mejor.'}</h2><p>Vas por ${a} de ${TOTAL} ejercicios. Sigue practicando las secciones pendientes y regresa aquí para revisar tus logros.</p><div class="track" style="max-width:600px;background:#615493;height:14px"><div class="fill" style="width:${percent()}%"></div></div></div><div class="summary-grid"><div class="summary-item"><strong>${percent()}%</strong><small>Recorrido completado</small></div><div class="summary-item"><strong>${c} / ${TOTAL}</strong><small>Respuestas acertadas</small></div><div class="summary-item"><strong>${points()} ⭐</strong><small>Puntos acumulados</small></div></div><div class="section-row"><div><h2>Tus insignias <span aria-hidden="true">✨</span></h2><p>Se iluminan a medida que resuelves retos.</p></div></div><div class="badges">${awards.map(([emoji,title,sub,ok])=>`<div class="award ${ok?'unlocked':''}"><span class="medal" aria-hidden="true">${emoji}</span><div><strong>${title}</strong><small>${sub}</small></div></div>`).join('')}</div><div class="white-card" style="margin-top:20px"><h3>📍 ¿Qué puedes hacer ahora?</h3><p>Revisa las estaciones que te falten, completa las lecturas o mejora tu escrito. Puedes guardar una copia de tus respuestas en formato de texto.</p><div class="chips"><button type="button" class="btn small" data-action="navigate" data-page="home">Ir al mapa de retos →</button><button type="button" class="btn small outline" data-action="report">⬇ Guardar resumen</button></div><p class="subtle">Los resultados se almacenan en este navegador. Si borras sus datos o abres la página en otro dispositivo, el progreso no se transfiere.</p></div>`}
function writingChecklistWithoutUI(){return Object.keys(prompts).filter(k=>wordCount(state.notes[k])>=(k==='tema'?2:8)).length}
function downloadReport(){let lines=['ARGUMENTA LAB — RESUMEN PERSONAL',`Ejercicios respondidos: ${answered()}/${TOTAL}`,`Respuestas correctas: ${correct()}/${TOTAL}`,`Puntaje: ${points()}`,`Estructura del taller: ${writingChecklistWithoutUI()}/7`,''];for(const l of lessons)lines.push(`${l.title}: ${countBy(l.id)}/${l.questions.length}`);articles.forEach((a,i)=>lines.push(`Lectura ${i+1}: ${a.questions.filter((_,j)=>state.answers[moduleKey('lectura'+i,j)]).length}/6`));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Mi_progreso_argumenta_lab.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function render(){updateBars();renderNav();let html='';switch(state.page){case 'home':html=renderHome();break;case 'lecturas':html=renderReading();break;case 'escritura':html=renderWriting();break;case 'logros':html=renderAchievements();break;default:html=renderLesson(lessons.find(l=>l.id===state.page)||lessons[0]);}document.getElementById('content').innerHTML=html;if(state.page==='home')updateMap();if(state.page==='escritura')writingChecklist();}
function getQuestion(key){for(const l of lessons)for(let i=0;i<l.questions.length;i++)if(moduleKey(l.id,i)===key)return {q:l.questions[i],i};for(let j=0;j<articles.length;j++)for(let i=0;i<articles[j].questions.length;i++)if(moduleKey('lectura'+j,i)===key)return {q:articles[j].questions[i],i};return null}
function answer(key,choice){const obj=getQuestion(key);if(!obj||state.answers[key])return;const right=choice===obj.q.answer;state.answers[key]={choice,correct:right};save();const old=document.getElementById('question-'+key);if(old){const temp=document.createElement('div');temp.innerHTML=questionHTML(obj.q,key,obj.i);old.replaceWith(temp.firstElementChild)}updateBars();renderNav();if(right){if(correct()%5===0)sparkle();if(answered()===TOTAL){sparkle();toast('¡Completaste los 54 retos! 🏆')}}}
function retry(key){if(!state.answers[key])return;delete state.answers[key];save();const o=getQuestion(key);const old=document.getElementById('question-'+key);if(old&&o){const t=document.createElement('div');t.innerHTML=questionHTML(o.q,key,o.i);old.replaceWith(t.firstElementChild)}updateBars();renderNav()}
let speech=null;
function stopSpeech(){try{if('speechSynthesis' in window)window.speechSynthesis.cancel()}catch(e){}}
function readText(){if(!('speechSynthesis' in window)){toast('Tu navegador no admite lectura en voz alta.');return}if(window.speechSynthesis.speaking){stopSpeech();toast('Lectura detenida.');return}const article=articles[state.article];speech=new SpeechSynthesisUtterance(article.title+'. '+article.paragraphs.join(' '));speech.lang='es-CO';speech.rate=.9;window.speechSynthesis.speak(speech);toast('Leyendo el texto en voz alta. Pulsa otra vez para detener.')}
function startClick(e){const b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;if(action==='navigate')return go(b.dataset.page);if(action==='answer')return answer(b.dataset.q,Number(b.dataset.choice));if(action==='retry')return retry(b.dataset.q);if(action==='article'){stopSpeech();state.article=Number(b.dataset.index);save();render();window.scrollTo({top:0,behavior:'smooth'});return}if(action==='map'){state.map=Number(b.dataset.index);save();document.querySelectorAll('.map-part').forEach((n,i)=>n.classList.toggle('selected',i===state.map));updateMap();return}if(action==='read')return readText();if(action==='sound'){if(window.speechSynthesis?.speaking){stopSpeech();toast('Lectura detenida.')}else if(state.page==='lecturas')readText();else toast('Entra a Lecturas profundas para escuchar los textos.');return}if(action==='size'){state.fontsize=(state.fontsize+1)%3;save();let el=document.getElementById('article-text');if(el)el.className='article-text text-size-'+state.fontsize;return}if(action==='starter'){const i=Number(b.dataset.index);state.notes.tema=['Clubes de lectura en la comunidad','El juego cooperativo en la escuela','Jornadas de reciclaje escolar'][i];state.notes.tesis=starterIdeas[i];save();render();toast('Idea añadida: ahora escribe tus razones.');return}if(action==='preview')return previewWriting();if(action==='export')return downloadText();if(action==='report')return downloadReport();if(action==='reset'){if(confirm('¿Seguro que quieres borrar las respuestas y el escrito guardado en este navegador?')){stopSpeech();state={page:'home',answers:{},article:0,notes:{},map:0,fontsize:0};save();render();toast('Progreso reiniciado. Puedes comenzar otra vez.')}return}}
document.addEventListener('click',startClick);
document.addEventListener('input',e=>{const k=e.target.dataset?.field;if(!k)return;state.notes[k]=e.target.value;save();const counter=document.getElementById('length-'+k);if(counter)counter.textContent=e.target.value.length+' caracteres';writingChecklist()});
render();
</script>
</body>
